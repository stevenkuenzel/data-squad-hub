name: Tests

on:
  push:
    branches: [master]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Install dev dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Simulation tests
        run: npm test
