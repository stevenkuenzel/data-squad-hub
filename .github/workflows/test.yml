name: Tests

on:
  push:
    branches: [master]
  pull_request:

jobs:
  sim-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check
        run: for f in *.js games/*.js; do node --check "$f"; done
      - name: Simulation tests
        run: npm test
